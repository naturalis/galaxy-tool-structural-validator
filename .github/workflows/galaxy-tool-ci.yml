name: Galaxy Tool CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'  # Push events to tags matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

#      - name: Create Planemo config
#        env:
#          USER: ${{ secrets.USER }}
#          KEY: ${{ secrets.KEY }}
#          EMAIL: ${{ secrets.EMAIL }}
#          PASS: ${{ secrets.PASS }}
#        run: |
#          mkdir -p $HOME/.planemo
#          cat > $HOME/.planemo.yml << EOF
#          shed_username: $USER # your ToolShed username
#          sheds:
#            toolshed:
#              key: $KEY        # your ToolShed API key, under 'User > API Keys'
#              email: $EMAIL    # your ToolShed email
#              password: $PASS  # your ToolShed password
#          EOF

      - name: Install Planemo
        run: |
          pip install planemo
          planemo --version

      - name: Lint Galaxy tool
        run: |
          set -e  # Ensure script fails on error
          planemo lint structural_validator.xml
          echo "Lint passed successfully"

      - name: Test Galaxy tool
        run: |
          set -e  # Ensure script fails on error
          planemo test structural_validator.xml
          echo "Tests passed successfully"

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Create Planemo config
        env:
          USER: ${{ secrets.USER }}
          KEY: ${{ secrets.KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASS: ${{ secrets.PASS }}
        run: |
          mkdir -p $HOME/.planemo
          cat > $HOME/.planemo.yml << EOF
          shed_username: $USER # your ToolShed username
          sheds:
            toolshed:
              key: $KEY        # your ToolShed API key, under 'User > API Keys'
              email: $EMAIL    # your ToolShed email
              password: $PASS  # your ToolShed password
          EOF

      - name: Install Planemo
        run: pip install planemo

      - name: Publish to Tool Shed
        run: |
          # Try to update first (for existing repositories)
          # If update fails, create the repository (first time publish)
          if planemo shed_update --shed_target toolshed; then
            echo "Successfully updated tool in ToolShed"
          else
            echo "Update failed, attempting to create tool in ToolShed (first time publish)"
            planemo shed_create --shed_target toolshed
          fi
